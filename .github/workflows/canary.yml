name: Canary release

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
  HUSKY: 0
  TOKENS_STUDIO_API_KEY: ${{ secrets.TOKENS_STUDIO_2_API_KEY }}

permissions:
  contents: read
  packages: write
  pull-requests: read

concurrency:
  group: canary-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'sl-design-system/components' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          registry-url: https://npm.pkg.github.com
          scope: '@sl-design-system'

      - run: yarn install --immutable

      - id: changesets
        name: Check pending releases
        shell: bash
        run: |
          yarn changeset status --output "$RUNNER_TEMP/changeset-status.json"

          if jq -e '.releases | any(.type != "none")' "$RUNNER_TEMP/changeset-status.json"; then
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create canary versions
        if: steps.changesets.outputs.has_releases == 'true'
        run: yarn version:canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish canary packages
        if: steps.changesets.outputs.has_releases == 'true'
        run: yarn release:canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
