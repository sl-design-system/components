name: Figma Code Connect (PR validation)

on:
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

env:
  HUSKY: 0

jobs:
  lint-mapping-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        env:
          FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
        run: yarn install --immutable

      - name: Lint Code Connect mapping naming
        working-directory: scripts/connect-figma-components
        run: node lint-mapping-names.mjs
