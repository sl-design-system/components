name: Figma Code Connect

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Figma Code Connect (PR validation)']
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

env:
  HUSKY: 0

jobs:
  preview:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    steps:
      - name: Log workflow trigger
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "workflow_run_conclusion=${{ github.event.workflow_run.conclusion || 'n/a' }}"
          echo "workflow_run_head_sha=${{ github.event.workflow_run.head_sha || github.sha }}"
          echo "head_repo=${{ github.event.workflow_run.head_repository.full_name || github.repository }}"
          echo "repo=${{ github.repository }}"
          echo "run_id=${{ github.run_id }}"

      - name: Checkout the trusted workflow SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'
        env:
          FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}

      - name: Install dependencies
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
          FONT_AWESOME_AUTH_TOKEN: ${{ secrets.FONT_AWESOME_AUTH_TOKEN }}
        run: yarn install --immutable

      - name: Run Code Connect preview
        working-directory: scripts/connect-figma-components
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: yarn connect:test:report

      - name: Publish report to job summary
        if: always()
        run: |
          if [ -f scripts/connect-figma-components/figma-connect-report.md ]; then
            cat scripts/connect-figma-components/figma-connect-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - if: always() && github.event_name != 'workflow_dispatch'
        uses: peter-evans/find-comment@v3
        id: fc
        with:
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          comment-author: 'github-actions[bot]'
          body-includes: '### 🧩 Figma Code Connect'

      - if: always() && github.event_name != 'workflow_dispatch'
        name: Build comment body
        id: comment
        env:
          REPORT_PATH: scripts/connect-figma-components/figma-connect-report.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EXISTING_BODY: ${{ steps.fc.outputs.comment-body }}
        run: |
          BODY="### 🧩 Figma Code Connect
          - [View workflow run]($RUN_URL)"

          if [ -f "$REPORT_PATH" ]; then
            SUMMARY=$(sed '/^$/d' "$REPORT_PATH" | head -n 20)
            BODY="$BODY

          $SUMMARY

          <details>
          <summary>View full report</summary>

          \`\`\`md
          $(cat "$REPORT_PATH")
          \`\`\`
          </details>"
          else
            BODY="$BODY

          - No report generated."
          fi

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - if: always() && github.event_name != 'workflow_dispatch'
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.fc.outputs.comment-id }}
          issue-number: ${{ github.event.workflow_run.pull_requests[0].number }}
          body: ${{ steps.comment.outputs.body }}
          edit-mode: replace

      - name: Upload Code Connect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-code-connect-report
          path: scripts/connect-figma-components/figma-connect-report.md
          if-no-files-found: warn
