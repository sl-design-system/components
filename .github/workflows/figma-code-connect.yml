name: Figma Code Connect

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Figma Code Connect (PR validation)']
    types: [completed]

permissions:
  actions: read
  contents: read

env:
  HUSKY: 0

jobs:
  preview:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      )
    runs-on: ubuntu-latest
    env:
      FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
    steps:
      - name: Checkout the trusted workflow SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'yarn'

      - run: yarn install --immutable

      - name: Run Code Connect preview
        working-directory: scripts/connect-figma-components
        run: yarn connect:test:report

      - name: Upload Code Connect report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: figma-code-connect-report
          path: scripts/connect-figma-components/figma-connect-report.md
          if-no-files-found: warn
