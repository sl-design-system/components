name: Label Outside Contributor Issues

on:
  issues:
    types: [opened]
  # Allow manual trigger for testing or full scan (leave issue_number empty to process all open issues)
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to process (leave empty to process all open issues)'
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  label-external-issues:
    runs-on: ubuntu-latest
    name: Label External Contributor Issues

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run label script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ISSUE="${{ github.event.issue.number || inputs.issue_number }}"
          bash .github/scripts/label-outside-contributors.sh "$ISSUE"
