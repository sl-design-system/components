name: Preview cleanup

on:
  # `pull_request_target` runs in the context of the base branch, so unlike
  # `pull_request` it also fires when a PR is closed while it has merge
  # conflicts. This workflow never checks out or runs code from the PR.
  pull_request_target:
    branches:
      - main
    types: [closed]

  # Safety net: remove previews of PRs that are already closed, e.g. when a
  # cleanup run failed or was skipped.
  schedule:
    - cron: '17 3 * * *'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    name: Cleanup ${{ matrix.preview }}-${{ github.event.pull_request.number }}
    strategy:
      fail-fast: false
      matrix:
        preview: [storybook, website]
    # Same group as the preview deploy job of this PR: closing the PR cancels a
    # deploy that is still running, so it can't recreate the branch afterwards.
    concurrency:
      group: ${{ matrix.preview }}-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Delete PR branch from Amplify
        env:
          APP_ID: ${{ secrets.AWS_AMPLIFY_APP_ID }}
          BRANCH: ${{ matrix.preview }}-${{ github.event.pull_request.number }}
        run: |
          if aws amplify get-branch --app-id "$APP_ID" --branch-name "$BRANCH" >/dev/null 2>&1; then
            aws amplify delete-branch --app-id "$APP_ID" --branch-name "$BRANCH" >/dev/null
            echo "Deleted Amplify branch '$BRANCH'."
          else
            echo "Amplify branch '$BRANCH' does not exist, nothing to clean up."
          fi

  sweep:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    name: Sweep closed PR previews
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ secrets.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

      - name: Delete Amplify branches of closed PRs
        env:
          APP_ID: ${{ secrets.AWS_AMPLIFY_APP_ID }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          BRANCHES=$(aws amplify list-branches --app-id "$APP_ID" --query 'branches[].branchName' --output text | tr '\t' '\n')

          for BRANCH in $BRANCHES; do
            # Only touch PR previews; never the production branch.
            if [[ ! "$BRANCH" =~ ^(storybook|website)-([0-9]+)$ ]]; then
              continue
            fi

            PR="${BASH_REMATCH[2]}"
            STATE=$(gh api "repos/$REPO/pulls/$PR" --jq '.state' 2>/dev/null || true)

            if [ "$STATE" == "closed" ]; then
              aws amplify delete-branch --app-id "$APP_ID" --branch-name "$BRANCH" >/dev/null
              echo "Deleted '$BRANCH' (PR #$PR is closed)."
            elif [ -z "$STATE" ]; then
              echo "::warning::Could not look up PR #$PR, keeping '$BRANCH'."
            fi
          done
