<!doctype html>
<meta charset="utf-8">
<title>Geometry comparator fixture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; border: 0; }
  body { margin: 0; position: relative; background: #fff; }
  .node { position: absolute; }
</style>
<!-- A placed wrapper: positioned straight from the metadata, so comparing it would be a
     tautology. It must be excluded from `compared` and counted as a `placedWrapper`. -->
<div data-region="r0" data-node-id="1:2" class="node" style="left:20px;top:30px;width:400px;height:200px;"></div>

<!-- 1:3 — placed exactly where the metadata says: delta 0, distance 0. -->
<div data-node-id="1:3" class="node" style="left:30px;top:40px;width:100px;height:50px;"></div>

<!-- 1:4 — deliberately shifted dx=+7, dy=-3 (metadata frame-relative x=170, y=40). -->
<div data-node-id="1:4" class="node" style="left:177px;top:37px;width:200px;height:24px;"></div>

<!-- 1:5 — width deliberately +12 (metadata w=300), position exact: distance 0, dwidth +12. -->
<div data-node-id="1:5" class="node" style="left:20px;top:300px;width:312px;height:100px;"></div>

<!-- Rendered but never declared: belongs in renderedOnly. -->
<div data-node-id="9:9" class="node" style="left:0px;top:0px;width:10px;height:10px;"></div>

<!-- Empty node id: must be ignored. -->
<div data-node-id="" class="node" style="left:0px;top:0px;width:5px;height:5px;"></div>
